<div class="card" [ngClass]="cardClasses" [ngStyle]="{ 'border-left-color': course.gradeStatus === 'passed' ? 'green' : course.gradeStatus === 'failed' ? 'red' : 'grey' }" appHighlight="lightyellow">
  <h3>{{ course.name }}</h3>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits }}</p>
  <p>Status: {{ course.gradeStatus | titlecase }}</p>
  <button (click)="toggleEnroll()">{{ enrollmentService.isEnrolled(course.id) ? 'Unenroll' : 'Enroll' }}</button>
</div>
