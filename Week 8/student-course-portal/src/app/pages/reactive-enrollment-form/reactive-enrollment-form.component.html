<section class="card">
  <h2>Reactive Enrollment Form</h2>
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <label>
      Name:
      <input formControlName="studentName" />
    </label>
    <div *ngIf="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched">
      <span *ngIf="enrollForm.get('studentName')?.errors?.required">Name is required</span>
      <span *ngIf="enrollForm.get('studentName')?.errors?.minlength">Name must be at least 3 characters</span>
    </div>

    <label>
      Email:
      <input formControlName="studentEmail" />
    </label>
    <div *ngIf="enrollForm.get('studentEmail')?.invalid && enrollForm.get('studentEmail')?.touched">
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.required">Email is required</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.email">Enter a valid email</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.emailTaken">Email taken</span>
    </div>

    <label>
      Course ID:
      <input formControlName="courseId" />
    </label>
    <div *ngIf="enrollForm.get('courseId')?.invalid && enrollForm.get('courseId')?.touched">
      <span *ngIf="enrollForm.get('courseId')?.errors?.required">Course ID is required</span>
      <span *ngIf="enrollForm.get('courseId')?.errors?.noCourseCode">Course code starting with XX is not allowed.</span>
    </div>

    <label>
      Semester:
      <select formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </label>

    <label>
      <input type="checkbox" formControlName="agreeToTerms" /> I agree to terms
    </label>

    <div formArrayName="additionalCourses">
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
        <input [formControl]="ctrl" />
        <button type="button" (click)="removeCourse(i)">Remove</button>
      </div>
    </div>
    <button type="button" (click)="addCourse()">Add Another Course</button>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  </form>
</section>
