<section class="card">
  <h2>Enrollment Request</h2>
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <label>
      Name:
      <input name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel" />
    </label>
    <div *ngIf="nameCtrl.touched && nameCtrl.errors?.required">Name is required</div>
    <div *ngIf="nameCtrl.touched && nameCtrl.errors?.minlength">Name must be at least 3 characters</div>

    <label>
      Email:
      <input name="studentEmail" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel" />
    </label>
    <div *ngIf="emailCtrl.touched && emailCtrl.errors?.required">Email is required</div>
    <div *ngIf="emailCtrl.touched && emailCtrl.errors?.email">Enter a valid email</div>

    <label>
      Course ID:
      <input type="number" name="courseId" [(ngModel)]="courseId" required #courseCtrl="ngModel" />
    </label>
    <div *ngIf="courseCtrl.touched && courseCtrl.errors?.required">Course ID is required</div>

    <label>
      Semester:
      <select name="preferredSemester" [(ngModel)]="preferredSemester" required>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </label>

    <label>
      <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required #termsCtrl="ngModel" />
      I agree to terms
    </label>
    <div *ngIf="termsCtrl.touched && termsCtrl.errors?.required">You must agree to terms</div>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="enrollForm.resetForm()">Reset</button>
  </form>

  <div *ngIf="submitted" class="success">Enrollment request submitted successfully!</div>
</section>
